services:
  - type: web
    name: truthguard-api
    env: python
    buildCommand: pip install -r apps/api/requirements.txt
    startCommand: cd apps/api && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        value: sqlite:///./truthguard.db
      - key: ADMIN_API_KEY
        generateValue: true
      - key: USE_MOCK_MODEL
        value: "true"
      - key: FRONTEND_URL
        value: "*"
